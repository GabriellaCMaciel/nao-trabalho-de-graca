name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: o fluxo só precisa ler o código.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci instala exatamente o que está no package-lock.json (build reproduzível).
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
